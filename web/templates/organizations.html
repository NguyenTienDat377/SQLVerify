{% extends "base.html" %}
{% block title %}Organizations — Skolem{% endblock %}
{% block content %}
<div class="sk-settings">
    <div class="sk-settings-header">
        <div class="sk-settings-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        </div>
        <div>
            <h1 class="sk-settings-title">Organizations</h1>
            <p class="sk-settings-desc">
                Share projects and verification history across a team. A Team
                subscription held by the owner covers every seat.
            </p>
        </div>
    </div>

    <form class="sk-create-form"
          hx-post="/api/organizations"
          hx-target="#organizations-panel"
          hx-swap="innerHTML">
        <input type="text" name="name" placeholder="Organization name (e.g. Acme Platform Team)"
               required maxlength="100" class="form-input">
        <button type="submit" class="btn btn-primary">Create organization</button>
    </form>

    <div id="organizations-panel">
        {% include "partials/organizations.html" %}
    </div>
</div>
{% endblock %}
