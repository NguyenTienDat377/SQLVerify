<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}SQLVerify - Formal Verification{% endblock %}
    </title>

    <!-- SEO / social preview -->
    <meta
      name="description"
      content="{% block description %}Prove your AI-generated SQL is correct before it ships. SQLVerify uses Z3/SMT formal verification to confirm two queries are equivalent — or hand you a counterexample database.{% endblock %}"
    />
    <link rel="canonical" href="{{ site_url }}{% block canonical_path %}{% endblock %}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SQLVerify" />
    <meta property="og:title" content="{% block og_title %}SQLVerify — Formal Verification for AI-Generated SQL{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}Prove your AI-generated SQL is correct before it ships — formal verification, not just a linter.{% endblock %}" />
    <meta property="og:url" content="{{ site_url }}{% block canonical_path_og %}{% endblock %}" />
    <meta property="og:image" content="{{ site_url }}/static/img/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{% block og_title_tw %}SQLVerify — Formal Verification for AI-Generated SQL{% endblock %}" />
    <meta name="twitter:description" content="{% block og_description_tw %}Prove your AI-generated SQL is correct before it ships — formal verification, not just a linter.{% endblock %}" />
    <meta name="twitter:image" content="{{ site_url }}/static/img/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/styles.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/img/favicon.png" />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Topbar -->
      <header class="topbar">
        <a href="/" class="topbar-logo" style="text-decoration: none; color: inherit;">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          SQLVerify
        </a>
        <div class="topbar-user">
          <a href="/pricing" class="topbar-link">Pricing</a>
          {% if user_email %}
          <span class="topbar-email">{{ user_email }}</span>
          <a href="/verify" class="topbar-link">Verify</a>
          <a href="/projects" class="topbar-link">Projects</a>
          <a href="/keys" class="topbar-link">API Keys</a>
          <a href="/billing/portal" class="topbar-link">Billing</a>
          <form method="post" action="/auth/logout" style="display: inline">
            <button type="submit" class="btn-logout">Sign out</button>
          </form>
          {% else %}
          <a href="/auth/login" class="btn-github-login">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
              />
            </svg>
            Sign in with GitHub
          </a>
          {% endif %}
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">{% block content %}{% endblock %}</main>

      <!-- Footer -->
      <footer
        class="app-footer"
        style="
          text-align: center;
          padding: 2rem 1rem;
          color: var(--text-secondary, #6b7280);
          font-size: 0.875rem;
        "
      >
        <a href="/terms" style="color: inherit; text-decoration: none">Terms</a>
        &middot;
        <a href="/privacy" style="color: inherit; text-decoration: none"
          >Privacy</a
        >
      </footer>
    </div>

    <script>
      // Simple JS for file upload name display
      document.addEventListener("change", function (e) {
        if (e.target && e.target.type === "file") {
          const file = e.target.files[0];
          const displayArea =
            e.target.parentElement.querySelector(".file-display");
          if (file && displayArea) {
            displayArea.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                            <polyline points="13 2 13 9 20 9"></polyline>
                        </svg>
                        ${file.name}
                    `;
          }
        }
      });
    </script>
  </body>
</html>
