{% extends "base.html" %}
{% block title %}Projects — Skolem{% endblock %}
{% block content %}
<div class="sk-settings">
    <div class="sk-settings-header">
        <div class="sk-settings-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
        </div>
        <div>
            <h1 class="sk-settings-title">Projects</h1>
            <p class="sk-settings-desc">
                Group verification runs into projects — one per service or repository.
            </p>
        </div>
    </div>

    <form class="sk-create-form"
          hx-post="/api/projects"
          hx-target="#projects-panel"
          hx-swap="innerHTML">
        <input type="text" name="name" placeholder="Project name (e.g. Payments API)"
               required maxlength="100" class="form-input">
        <input type="text" name="description" placeholder="Description (optional)"
               maxlength="500" class="form-input">
        {% if orgs %}
        <select name="org_id" class="form-input">
            <option value="">Personal (just me)</option>
            {% for org in orgs %}
            <option value="{{ org.id }}">Share with: {{ org.name }}</option>
            {% endfor %}
        </select>
        {% endif %}
        <button type="submit" class="btn btn-primary">Create project</button>
    </form>

    <div id="projects-panel">
        {% include "partials/projects.html" %}
    </div>
</div>
{% endblock %}
