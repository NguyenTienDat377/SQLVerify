{% extends "base.html" %}
{% block title %}Projects — SQLVerify{% endblock %}
{% block content %}
<div class="projects-page" style="max-width: 720px; margin: 0 auto;">
    <h1>Projects</h1>
    <p style="color: var(--text-secondary);">
        Group your verification runs into projects (e.g. one per service or
        repository). Create a project below, then attach runs to it.
    </p>

    <form class="project-create-form"
          hx-post="/api/projects"
          hx-target="#projects-panel"
          hx-swap="innerHTML"
          style="display: flex; gap: 0.5rem; margin: 1.5rem 0; flex-wrap: wrap;">
        <input type="text" name="name" placeholder="Project name (e.g. Payments API)"
               required maxlength="100" class="form-input" style="flex: 1; min-width: 200px;">
        <input type="text" name="description" placeholder="Description (optional)"
               maxlength="500" class="form-input" style="flex: 1; min-width: 200px;">
        <button type="submit" class="btn btn-primary">Create project</button>
    </form>

    <div id="projects-panel">
        {% include "partials/projects.html" %}
    </div>
</div>
{% endblock %}
