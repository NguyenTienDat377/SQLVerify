{% if error %}
<div class="sk-banner sk-banner--error">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    {{ error }}
</div>
{% endif %}

<ul class="sk-list">
    {% for p in projects %}
    <li class="sk-list-row">
        <div class="sk-list-content">
            <span class="sk-list-name">{{ p.name }}</span>
            {% if p.description %}
            <span class="sk-list-meta">{{ p.description }}</span>
            {% endif %}
        </div>
        <button class="btn btn-danger btn-sm"
                hx-post="/api/projects/{{ p.id }}/delete"
                hx-target="#projects-panel"
                hx-swap="innerHTML"
                hx-confirm="Delete this project? Its verification runs are kept but unlinked.">
            Delete
        </button>
    </li>
    {% else %}
    <li class="sk-list-empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        No projects yet — create one above.
    </li>
    {% endfor %}
</ul>
