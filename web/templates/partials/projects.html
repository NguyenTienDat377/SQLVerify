{% if error %}
<div class="project-error glass-panel" style="padding: 0.75rem 1rem; margin-bottom: 1rem; border-left: 3px solid var(--danger, #e5484d); color: var(--text-secondary);">
    {{ error }}
</div>
{% endif %}

<ul class="projects-list list-container">
    {% for p in projects %}
    <li class="project-row list-row">
        <div class="list-row-content">
            <div class="project-name" style="font-weight: 600; color: var(--text-primary);">{{ p.name }}</div>
            {% if p.description %}
            <div class="project-desc" style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.125rem;">{{ p.description }}</div>
            {% endif %}
        </div>
        <button class="btn btn-danger"
                hx-post="/api/projects/{{ p.id }}/delete"
                hx-target="#projects-panel"
                hx-swap="innerHTML"
                hx-confirm="Delete this project? Its verification runs are kept but unlinked.">
            Delete
        </button>
    </li>
    {% else %}
    <li class="project-empty" style="color: var(--text-secondary); padding: 1.5rem; text-align: center; border: 1px dashed var(--panel-border); border-radius: 8px;">
        No projects yet — create one above.
    </li>
    {% endfor %}
</ul>
