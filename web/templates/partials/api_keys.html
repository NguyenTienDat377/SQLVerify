{% if new_key %}
<div class="key-banner glass-panel" style="padding: 1rem; margin-bottom: 1rem; border-left: 3px solid var(--accent, #5b8def);">
    <p style="margin: 0 0 0.5rem;"><strong>Copy your new key now — you won't be able to see it again:</strong></p>
    <code class="key-reveal" style="display: block; word-break: break-all; user-select: all;">{{ new_key }}</code>
</div>
{% endif %}

<ul class="api-keys-list list-container">
    {% for k in keys %}
    <li class="api-key-row list-row">
        <span class="api-key-name" style="font-weight: 600; color: var(--text-primary);">{{ k.name }}</span>
        <code class="api-key-prefix" style="color: var(--text-secondary); background: rgba(255,255,255,0.05); padding: 0.125rem 0.375rem; border-radius: 4px; font-size: 0.8rem;">{{ k.key_prefix }}…</code>
        <div class="list-row-content"></div>
        {% if k.revoked_at %}
            <span class="api-key-revoked" style="color: var(--text-secondary); font-size: 0.85rem; font-style: italic;">revoked</span>
        {% else %}
            <button class="btn btn-danger"
                    hx-post="/api/keys/{{ k.id }}/revoke"
                    hx-target="#api-keys-panel"
                    hx-swap="innerHTML"
                    hx-confirm="Revoke this key? Any CI client using it will start getting 401s.">
                Revoke
            </button>
        {% endif %}
    </li>
    {% else %}
    <li class="api-key-empty" style="color: var(--text-secondary); padding: 1.5rem; text-align: center; border: 1px dashed var(--panel-border); border-radius: 8px;">
        No API keys yet — create one above.
    </li>
    {% endfor %}
</ul>
