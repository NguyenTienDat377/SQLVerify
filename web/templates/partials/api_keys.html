{% if new_key %}
<div class="sk-banner sk-banner--info">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
    <div>
        <strong>Copy your new key now — you won't see it again:</strong>
        <code class="sk-key-reveal">{{ new_key }}</code>
    </div>
</div>
{% endif %}

<ul class="sk-list">
    {% for k in keys %}
    <li class="sk-list-row {% if k.revoked_at %}sk-list-row--dimmed{% endif %}">
        <div class="sk-list-content">
            <span class="sk-list-name">{{ k.name }}</span>
            <code class="sk-list-code">{{ k.key_prefix }}…</code>
        </div>
        {% if k.revoked_at %}
        <div class="sk-list-actions">
            <span class="sk-badge sk-badge--muted">revoked</span>
            <button class="btn btn-secondary btn-sm"
                    hx-delete="/api/keys/{{ k.id }}"
                    hx-target="#api-keys-panel"
                    hx-swap="innerHTML"
                    hx-confirm="Permanently delete this revoked key?">
                Delete
            </button>
        </div>
        {% else %}
        <button class="btn btn-danger btn-sm"
                hx-post="/api/keys/{{ k.id }}/revoke"
                hx-target="#api-keys-panel"
                hx-swap="innerHTML"
                hx-confirm="Revoke this key? Any CI client using it will start getting 401s.">
            Revoke
        </button>
        {% endif %}
    </li>
    {% else %}
    <li class="sk-list-empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
        </svg>
        No API keys yet — create one above.
    </li>
    {% endfor %}
</ul>
