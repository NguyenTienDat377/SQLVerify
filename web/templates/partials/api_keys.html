{% if new_key %}
<div class="key-banner glass-panel" style="padding: 1rem; margin-bottom: 1rem; border-left: 3px solid var(--accent, #5b8def);">
    <p style="margin: 0 0 0.5rem;"><strong>Copy your new key now — you won't be able to see it again:</strong></p>
    <code class="key-reveal" style="display: block; word-break: break-all; user-select: all;">{{ new_key }}</code>
</div>
{% endif %}

<ul class="api-keys-list" style="list-style: none; padding: 0; margin: 0;">
    {% for k in keys %}
    <li class="api-key-row"
        style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border, #2a2a35);">
        <span class="api-key-name" style="font-weight: 600;">{{ k.name }}</span>
        <code class="api-key-prefix" style="color: var(--text-secondary);">{{ k.key_prefix }}…</code>
        <span style="flex: 1;"></span>
        {% if k.revoked_at %}
            <span class="api-key-revoked" style="color: var(--text-secondary); font-size: 0.85rem;">revoked</span>
        {% else %}
            <button class="btn btn-danger"
                    hx-post="/api/keys/{{ k.id }}/revoke"
                    hx-target="#api-keys-panel"
                    hx-swap="innerHTML"
                    hx-confirm="Revoke this key? Any CI client using it will start getting 401s.">
                Revoke
            </button>
        {% endif %}
    </li>
    {% else %}
    <li class="api-key-empty" style="color: var(--text-secondary); padding: 0.75rem 0;">
        No API keys yet — create one above.
    </li>
    {% endfor %}
</ul>
