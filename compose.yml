services:
  api:
    build:
      context: .
    container_name: sqlverify-api
    env_file: .env
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: sqlverify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
