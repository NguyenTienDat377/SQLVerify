[project]
name = "skolem"
version = "0.1.0"
description = "Formally verify that two SQL queries are semantically equivalent."
readme = "README.md"
requires-python = ">=3.9"
# httpx only — this is a thin client over POST /api/verify/text. The Z3 solver
# lives on the server, so `pipx install skolem` must stay tiny.
dependencies = ["httpx>=0.27.0"]

[project.scripts]
skolem = "skolem_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["skolem_cli"]
